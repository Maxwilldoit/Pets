<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; style-src 'self'; script-src 'self'" />
    <title>Pets · 桌面宠物</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
          <ellipse cx="16" cy="21.5" rx="7.2" ry="6.2" fill="currentColor" />
          <ellipse cx="7.4" cy="13.6" rx="2.9" ry="3.6" transform="rotate(-18 7.4 13.6)" fill="currentColor" />
          <ellipse cx="12.6" cy="8.4" rx="2.9" ry="3.8" transform="rotate(-6 12.6 8.4)" fill="currentColor" />
          <ellipse cx="19.4" cy="8.4" rx="2.9" ry="3.8" transform="rotate(6 19.4 8.4)" fill="currentColor" />
          <ellipse cx="24.6" cy="13.6" rx="2.9" ry="3.6" transform="rotate(18 24.6 13.6)" fill="currentColor" />
        </svg>
        <div>
          <div class="brand-name">Pets</div>
          <div class="brand-sub" data-i18n="app.subtitle">桌面宠物</div>
        </div>
      </div>
      <button class="btn btn-ghost btn-icon" id="btn-settings" aria-haspopup="dialog" aria-expanded="false"
        title="设置" aria-label="设置" data-i18n-title="nav.settings" data-i18n-aria="nav.settings">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="2.6" /><path d="M10 2.8l1 2.2 2.4-.5 1.5 1.5-.5 2.4 2.2 1v2.2l-2.2 1 .5 2.4-1.5 1.5-2.4-.5-1 2.2H8.9l-1-2.2-2.4.5-1.5-1.5.5-2.4-2.2-1V9.4l2.2-1-.5-2.4 1.5-1.5 2.4.5 1-2.2z" /></svg>
      </button>
    </header>

    <main class="library">
      <div class="library-main">
        <div class="toolbar">
          <label class="search">
            <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.6" /><path d="M13.2 13.2 17 17" /></svg>
            <input id="search" type="search" placeholder="搜索名称、标签或描述" data-i18n-placeholder="search.placeholder" autocomplete="off" />
          </label>
          <div class="segmented" id="filters" role="group" aria-label="宠物来源" data-i18n-aria="filter.label" hidden></div>
        </div>
        <div class="grid" id="grid" aria-label="宠物库" data-i18n-aria="nav.library"></div>
        <div class="problems" id="problems"></div>
      </div>

      <aside class="stage-panel" id="stage-panel" aria-label="宠物详情" data-i18n-aria="detail.information">
        <div class="stage" id="stage" data-phase="day">
          <canvas id="stage-canvas"></canvas>
          <span class="stage-anim" id="stage-anim"></span>
          <div class="away" id="away" hidden>
            <strong id="away-title"></strong>
            <span data-i18n="stage.awayHint">想 TA 了就点「收回来」</span>
          </div>
        </div>
        <div class="stage-bar">
          <div class="stage-id">
            <h2 id="pet-name"></h2>
            <div class="stage-sub" id="pet-sub"></div>
          </div>
          <div class="stage-cta">
            <button class="btn btn-lg btn-primary" id="btn-main"></button>
            <button class="btn btn-lg btn-icon" id="btn-more" aria-haspopup="menu" aria-expanded="false"
              title="更多操作" aria-label="更多操作" data-i18n-title="menu.more" data-i18n-aria="menu.more">
              <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="4" cy="10" r="1.4" /><circle cx="10" cy="10" r="1.4" /><circle cx="16" cy="10" r="1.4" /></svg>
            </button>
            <div class="menu" id="more-menu" role="menu" hidden></div>
          </div>
        </div>
        <div class="stage-body" id="stage-body"></div>
      </aside>
    </main>

    <div class="scrim" id="scrim"></div>
    <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" inert>
      <div class="drawer-head">
        <h2 id="drawer-title" data-i18n="nav.settings">设置</h2>
        <button class="btn btn-ghost btn-icon" id="btn-drawer-close" title="关闭设置" aria-label="关闭设置"
          data-i18n-title="drawer.close" data-i18n-aria="drawer.close">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" /></svg>
        </button>
      </div>
      <div class="settings" id="settings"></div>
    </aside>

    <div class="toast" id="toast" role="status" aria-live="polite">
      <canvas class="toast-avatar" id="toast-avatar" width="36" height="36" aria-hidden="true"></canvas>
      <span id="toast-text"></span>
    </div>
    <script type="module" src="panel.js"></script>
  </body>
</html>
