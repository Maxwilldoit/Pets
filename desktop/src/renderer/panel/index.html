<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; style-src 'self'; script-src 'self'" />
    <title>Pets · 桌面宠物</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
          <ellipse cx="16" cy="21.5" rx="7.2" ry="6.2" fill="currentColor" />
          <ellipse cx="7.4" cy="13.6" rx="2.9" ry="3.6" transform="rotate(-18 7.4 13.6)" fill="currentColor" />
          <ellipse cx="12.6" cy="8.4" rx="2.9" ry="3.8" transform="rotate(-6 12.6 8.4)" fill="currentColor" />
          <ellipse cx="19.4" cy="8.4" rx="2.9" ry="3.8" transform="rotate(6 19.4 8.4)" fill="currentColor" />
          <ellipse cx="24.6" cy="13.6" rx="2.9" ry="3.6" transform="rotate(18 24.6 13.6)" fill="currentColor" />
        </svg>
        <div>
          <div class="brand-name">Pets</div>
          <div class="brand-sub" data-i18n="app.subtitle">桌面宠物</div>
        </div>
      </div>
      <nav class="tabs" role="tablist" aria-label="页面" data-i18n-aria="nav.label">
        <button class="tab is-active" role="tab" data-view="library" aria-selected="true" data-i18n="nav.library">宠物库</button>
        <button class="tab" role="tab" data-view="settings" aria-selected="false" data-i18n="nav.settings">设置</button>
      </nav>
    </header>

    <main class="views">
      <section class="view is-active" id="view-library" aria-label="宠物库" data-i18n-aria="nav.library">
        <div class="library">
          <div class="library-main">
            <div class="toolbar">
              <label class="search">
                <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.6" /><path d="M13.2 13.2 17 17" /></svg>
                <input id="search" type="search" placeholder="搜索名称、标签或描述" data-i18n-placeholder="search.placeholder" autocomplete="off" />
              </label>
              <div class="segmented" id="filters" role="group" aria-label="宠物来源" data-i18n-aria="filter.label"></div>
              <div class="toolbar-actions">
                <button class="btn" id="btn-import" title="选择宠物文件夹" data-i18n="toolbar.import" data-i18n-title="toolbar.importTitle">导入宠物</button>
                <button class="btn btn-ghost btn-icon" id="btn-folder" title="打开本地宠物文件夹" aria-label="打开本地宠物文件夹" data-i18n-title="toolbar.openFolder" data-i18n-aria="toolbar.openFolder">
                  <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2.8 6.2a1.6 1.6 0 0 1 1.6-1.6h3.4l1.7 1.9h6.1a1.6 1.6 0 0 1 1.6 1.6v6.5a1.6 1.6 0 0 1-1.6 1.6H4.4a1.6 1.6 0 0 1-1.6-1.6z" /></svg>
                </button>
                <button class="btn btn-ghost btn-icon" id="btn-reload" title="刷新宠物库" aria-label="刷新宠物库" data-i18n-title="toolbar.refresh" data-i18n-aria="toolbar.refresh">
                  <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 10a6 6 0 1 1-1.8-4.3" /><path d="M16.2 3.2v3.6h-3.6" /></svg>
                </button>
              </div>
            </div>
            <div class="grid" id="grid"></div>
            <div class="problems" id="problems"></div>
          </div>
          <aside class="detail" id="detail" aria-label="宠物详情" data-i18n-aria="detail.information"></aside>
        </div>
      </section>

      <section class="view" id="view-settings" aria-label="设置" data-i18n-aria="nav.settings">
        <div class="settings" id="settings"></div>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="panel.js"></script>
  </body>
</html>
