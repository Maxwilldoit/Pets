name: Desktop release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (for example, v0.1.1)'
        required: true
        type: string

permissions:
  contents: read

# Serialize push/dispatch/reruns for the same tag, including the final publish.
concurrency:
  group: desktop-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  validate:
    name: Validate exact release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      commit: ${{ steps.verify.outputs.commit }}
    steps:
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate requested tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { appendFileSync } from 'node:fs';
          const dispatch = process.env.EVENT_NAME === 'workflow_dispatch';
          if (!dispatch) assert.equal(process.env.REF_TYPE, 'tag');
          const tag = dispatch ? process.env.INPUT_TAG : process.env.REF_NAME;
          assert.match(tag ?? '', /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/);
          appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\n`);
          NODE

      - name: Check out the requested tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify tag, desktop version, and release notes
        id: verify
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          EXPECTED_COMMIT: ${{ github.event_name == 'push' && github.sha || '' }}
        run: node scripts/release-artifacts.mjs verify-tag "$RELEASE_TAG" "$EXPECTED_COMMIT"

      # These checks use only Node built-ins; no dependencies are needed here.
      - name: Run desktop tests
        run: npm --prefix desktop test

      - name: Test release package aggregation
        run: node --test scripts/release-artifacts.test.mjs

      - name: Validate all pets
        run: npm --prefix desktop run validate

      - name: Require explicit asset licenses
        run: node scripts/check-pet-licenses.mjs --strict

      - name: Check the public snapshot library
        run: python3 scripts/build-snapshot-library.py --check

  build:
    name: Build ${{ matrix.platform }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2025
            node-platform: win32
            arch: x64
            target: win
          # GitHub documents this label as Intel; macos-15 is Apple silicon.
          - platform: macos-x64
            runner: macos-15-intel
            node-platform: darwin
            arch: x64
            target: mac
          - platform: macos-arm64
            runner: macos-15
            node-platform: darwin
            arch: arm64
            target: mac
          - platform: linux-x64
            runner: ubuntu-24.04
            node-platform: linux
            arch: x64
            target: linux
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      EXPECTED_COMMIT: ${{ needs.validate.outputs.commit }}
      RELEASE_PLATFORM: ${{ matrix.platform }}
      BUILD_TARGET: ${{ matrix.target }}
      BUILD_ARCH: ${{ matrix.arch }}
      EXPECTED_NODE_PLATFORM: ${{ matrix.node-platform }}
    steps:
      - name: Check out the exact validated tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.validate.outputs.tag }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up native Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify native runner and unchanged tag
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          assert.equal(process.platform, process.env.EXPECTED_NODE_PLATFORM);
          assert.equal(process.arch, process.env.BUILD_ARCH);
          NODE
          node scripts/release-artifacts.mjs verify-tag "$RELEASE_TAG" "$EXPECTED_COMMIT"

      - name: Install locked desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Run tests and pet validation on this platform
        working-directory: desktop
        run: |
          npm test
          npm run validate

      - name: Build distribution packages without publishing
        working-directory: desktop
        run: npm run dist -- "--$BUILD_TARGET" "--$BUILD_ARCH" --publish never

      - name: Verify packaged code and all 11 pets; stage only release packages
        run: node scripts/release-artifacts.mjs stage "$RELEASE_TAG" "$RELEASE_PLATFORM" desktop/dist release-stage

      - name: Upload this platform's checked packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pets-${{ needs.validate.outputs.tag }}-${{ matrix.platform }}
          path: release-stage/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          # Only replace this run's temporary Actions artifact on a build rerun.
          overwrite: true

  release:
    name: Verify all packages and publish the complete draft
    needs: [validate, build]
    if: ${{ needs.validate.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      EXPECTED_COMMIT: ${{ needs.validate.outputs.commit }}
    steps:
      - name: Check out the exact validated tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.validate.outputs.tag }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify unchanged tag and version
        run: node scripts/release-artifacts.mjs verify-tag "$RELEASE_TAG" "$EXPECTED_COMMIT"

      - name: Download all four platform artifacts from this workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pets-${{ needs.validate.outputs.tag }}-*
          path: release-downloads
          # Preserve origin directories so duplicate filenames cannot be hidden.
          merge-multiple: false
          digest-mismatch: error

      - name: Require exactly eight packages and generate SHA256SUMS
        run: node scripts/release-artifacts.mjs aggregate "$RELEASE_TAG" release-downloads release-packages

      - name: Attest the eight packages and SHA256SUMS
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-packages/*

      - name: Create or resume draft, verify all nine assets, then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-artifacts.mjs publish "$RELEASE_TAG" release-packages "$EXPECTED_COMMIT"
