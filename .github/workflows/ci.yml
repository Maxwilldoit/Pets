name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # 测试与校验只用到 Node 内置模块，不需要 npm install
      - name: 单元测试
        run: node --test "desktop/test/*.test.js"
      - name: 校验宠物仓库
        run: node desktop/scripts/validate-pets.js
      - name: 校验发行包聚合
        run: node --test scripts/release-artifacts.test.mjs
      - name: 检查依赖安全公告
        run: npm audit --prefix desktop --audit-level=high
      - name: 检查素材许可状态
        run: node scripts/check-pet-licenses.mjs
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: 校验公开素材库目录
        run: python scripts/build-snapshot-library.py --check
