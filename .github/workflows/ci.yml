name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # 测试与校验只用到 Node 内置模块，不需要 npm install
      - name: 单元测试
        run: node --test "desktop/test/*.test.js"
      - name: 校验宠物仓库
        run: node desktop/scripts/validate-pets.js
      - name: 校验发行包聚合
        run: node --test scripts/release-artifacts.test.mjs
      - name: 检查依赖安全公告
        run: npm audit --prefix desktop --audit-level=high
      - name: 检查素材许可状态
        run: node scripts/check-pet-licenses.mjs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: 校验公开素材库目录
        run: python scripts/build-snapshot-library.py --check
